<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi SDIT Aladzievie</title>
    <!-- CDN Tailwind CSS & Supabase JS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- FORM LOGIN -->
    <div id="login-card" class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Login SDIT Aladzievie</h2>
        
        <div id="alert-error" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-sm"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Username</label>
                <input type="text" id="username" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Masukkan username" required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" id="password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Masukkan password" required>
            </div>
            <button type="submit" id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200">
                Masuk
            </button>
        </form>
    </div>

    <!-- DASHBOARD (Muncul setelah berhasil login) -->
    <div id="dashboard-card" class="hidden bg-white p-8 rounded-xl shadow-md w-full max-w-2xl text-center">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Selamat Datang!</h1>
        <p id="user-info" class="text-gray-600 mb-6"></p>
        <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg transition duration-200">
            Keluar (Logout)
        </button>
    </div>

    <script>
        // ============================================================
        // ⚠️ MASUKKAN URL & KEYS SUPABASE KAMU DI SINI
        // ============================================================
        const SUPABASE_URL = "https://XXXXXXXXXXXX.supabase.co"; // Ganti dengan Project URL Supabase
        const SUPABASE_KEY = "eyJhbGciOiJKV1QiLC...";            // Ganti dengan anon public key (yang panjang)
        
        // Inisialisasi Supabase Client
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Fungsi Handle Login
        async function handleLogin(e) {
            e.preventDefault();
            
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const alertError = document.getElementById('alert-error');
            const btnLogin = document.getElementById('btn-login');

            alertError.classList.add('hidden');
            btnLogin.innerText = 'Memproses...';
            btnLogin.disabled = true;

            try {
                // Cek data user langsung dari tabel 'users' Supabase
                const { data, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('username', usernameInput)
                    .eq('password', passwordInput)
                    .single();

                if (error || !data) {
                    throw new Error('Username atau Password salah!');
                }

                // Jika Berhasil Login
                document.getElementById('login-card').classList.add('hidden');
                document.getElementById('dashboard-card').classList.remove('hidden');
                document.getElementById('user-info').innerText = `Halo ${data.nama} (${data.role.toUpperCase()})`;

            } catch (err) {
                alertError.innerText = err.message;
                alertError.classList.remove('hidden');
            } finally {
                btnLogin.innerText = 'Masuk';
                btnLogin.disabled = false;
            }
        }

        // Fungsi Handle Logout
        function handleLogout() {
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('dashboard-card').classList.add('hidden');
            document.getElementById('login-card').classList.remove('hidden');
        }
    </script>
</body>
</html>
