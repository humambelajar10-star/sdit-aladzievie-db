<!-- JAVASCRIPT CORE SYSTEM (VERSI FIX FULL BISA DIPENCET) -->
  <script>
    const SUPABASE_URL = "https://tavoxawaparjahyldecc.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhdm94YXdhcGFyamFoeWxkZWNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4OTc4MzgsImV4cCI6MjEwMTQ3MzgzOH0.21A23nlVJ9gaF1u86W3tQCcNggPOi1Wvaj4awaV0nEI";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var currentSessionUser = '';
    var currentSessionRole = '';
    var currentSiswaObj = null;

    window.onload = function() {
      var today = new Date().toISOString().split('T')[0];
      ['absen-tgl', 'setor-tgl', 'tasmi-tgl', 'disiplin-tgl', 'kaldik-tgl', 'tugas-deadline'].forEach(function(id) {
        var el = document.getElementById(id);
        if(el) el.value = today;
      });
      loadKelasOptions();
    };

    // MODE LOGIN
    function switchLoginMode(mode) {
      var btnG = document.getElementById('btn-login-guru');
      var btnO = document.getElementById('btn-login-ortu');
      var formG = document.getElementById('form-login-guru');
      var formO = document.getElementById('form-login-ortu');
      document.getElementById('login-msg').classList.add('hidden');

      if (mode === 'guru') {
        btnG.className = "flex-1 py-2 rounded-lg bg-white text-[#1A98FF] shadow font-bold";
        btnO.className = "flex-1 py-2 rounded-lg text-gray-500 font-bold";
        formG.classList.remove('hidden'); formO.classList.add('hidden');
      } else {
        btnO.className = "flex-1 py-2 rounded-lg bg-white text-emerald-600 shadow font-bold";
        btnG.className = "flex-1 py-2 rounded-lg text-gray-500 font-bold";
        formO.classList.remove('hidden'); formG.classList.add('hidden');
      }
    }

    // MODAL HANDLERS
    function bukaModalLainnya() { document.getElementById('modal-lainnya').classList.remove('hidden'); }
    function tutupModalLainnya() { document.getElementById('modal-lainnya').classList.add('hidden'); }

    // LOGIN GURU
    async function prosesLoginGuru() {
      var u = document.getElementById('login-user').value.trim();
      var p = document.getElementById('login-pass').value.trim();
      var msg = document.getElementById('login-msg');

      if (!u || !p) { msg.innerText = "Isi username dan password!"; msg.classList.remove('hidden'); return; }

      try {
        const { data, error } = await db.from('users').select('*').eq('username', u).eq('password', p).single();
        if (error || !data) throw new Error("Username atau password salah!");

        currentSessionUser = data.username;
        currentSessionRole = data.role;

        applyRoleAccess('Guru');
        bukaTab('beranda');
      } catch (err) {
        msg.innerText = err.message;
        msg.classList.remove('hidden');
      }
    }

    // LOGIN WALI MURID (DILENGKAPI DETEKSI NAMA SISWA)
    async function prosesLoginOrtu() {
      var nisVal = document.getElementById('login-nis').value.trim();
      var passVal = document.getElementById('login-ortu-pass').value.trim();
      var msg = document.getElementById('login-msg');

      if (!nisVal) { msg.innerText = "Masukkan NIS Siswa Ananda!"; msg.classList.remove('hidden'); return; }

      try {
        // Cari siswa di Supabase
        const { data: siswaList, error } = await db.from('siswa').select('*').eq('nis', nisVal);
        if (error || !siswaList || siswaList.length === 0) throw new Error("NIS Siswa tidak ditemukan!");

        var siswa = siswaList[0];
        
        // Deteksi Nama Siswa dari berbagai opsi nama kolom (nama / Nama_Siswa)
        siswa.namaSiswaFix = siswa.nama || siswa.Nama_Siswa || siswa.nama_siswa || 'Ananda';

        // Validasi password (jika di DB kosong, gunakan NIS)
        var validPass = siswa.password ? siswa.password : siswa.nis;
        if (passVal !== validPass) throw new Error("Password Wali Murid salah!");

        currentSessionUser = siswa.namaSiswaFix;
        currentSessionRole = 'Ortu';
        currentSiswaObj = siswa;

        applyRoleAccess('Ortu');
        bukaTab('beranda');
      } catch (err) {
        msg.innerText = err.message;
        msg.classList.remove('hidden');
      }
    }

    // TERAPKAN AKSES & NAMA LENGKAP
    function applyRoleAccess(role) {
      document.getElementById('view-login').classList.add('hidden');
      document.getElementById('app-header').classList.remove('hidden');
      document.getElementById('app-main').classList.remove('hidden');
      document.getElementById('app-nav').classList.remove('hidden');

      var isOrtu = (role === 'Ortu');

      // Sembunyikan form input untuk Ortu
      ['form-input-absen', 'form-input-setoran', 'form-input-tasmi', 'form-input-disiplin', 'form-input-tugas', 'form-input-tabungan', 'form-input-spp', 'form-input-pengumuman', 'form-input-kaldik'].forEach(function(id) {
        var el = document.getElementById(id);
        if(el) {
          if (isOrtu) el.classList.add('hidden');
          else el.classList.remove('hidden');
        }
      });

      if (isOrtu) {
        var namaSantri = currentSiswaObj.namaSiswaFix;
        document.getElementById('role-badge-display').innerText = 'PORTAL WALI MURID';
        document.getElementById('welcome-title').innerText = 'Wali dari ' + namaSantri;
        document.getElementById('welcome-sub').innerText = 'Kelas: ' + (currentSiswaObj.kelas || currentSiswaObj.Kelas || '-') + ' | NIS: ' + currentSiswaObj.nis;
        document.getElementById('session-info').innerText = 'Wali dari ' + namaSantri;
      } else {
        document.getElementById('role-badge-display').innerText = 'PORTAL GURU / STAFF';
        document.getElementById('welcome-title').innerText = 'Selamat Datang! 👋';
        document.getElementById('welcome-sub').innerText = currentSessionUser + ' (' + currentSessionRole + ')';
        document.getElementById('session-info').innerText = currentSessionUser + ' (' + currentSessionRole + ')';
      }

      refreshAllData();
    }

    function logout() { location.reload(); }

    // TAB MAIN SYSTEM
    function bukaTab(tabName) {
      tutupModalLainnya();
      ['beranda', 'akademik', 'keuangan', 'informasi'].forEach(function(t) {
        if(document.getElementById('view-' + t)) document.getElementById('view-' + t).classList.add('hidden');
        if(document.getElementById('nav-' + t)) document.getElementById('nav-' + t).className = 'flex-1 flex flex-col items-center justify-center space-y-1 text-gray-400 hover:text-[#1A98FF] transition py-1';
      });

      if(document.getElementById('view-' + tabName)) document.getElementById('view-' + tabName).classList.remove('hidden');

      if (tabName === 'beranda') {
        document.getElementById('nav-beranda-btn').className = 'w-14 h-14 bg-[#1A98FF] text-white rounded-full flex items-center justify-center shadow-lg border-4 border-white scale-105 transition';
        document.getElementById('nav-beranda-txt').className = 'text-[10px] font-bold text-[#1A98FF] mt-1';
      } else {
        document.getElementById('nav-beranda-btn').className = 'w-14 h-14 bg-[#1A98FF] text-white rounded-full flex items-center justify-center shadow-md border-4 border-white hover:bg-blue-600 transition';
        document.getElementById('nav-beranda-txt').className = 'text-[10px] font-medium text-gray-500 mt-1';
        if(document.getElementById('nav-' + tabName)) document.getElementById('nav-' + tabName).className = 'flex-1 flex flex-col items-center justify-center space-y-1 nav-btn-active transition py-1';
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // SUB TAB AKADEMIK
    function subTabAkademik(sub) {
      ['absen', 'hafalan', 'tasmi', 'disiplin', 'tugas'].forEach(function(s) {
        if(document.getElementById('box-akademik-' + s)) document.getElementById('box-akademik-' + s).classList.add('hidden');
        if(document.getElementById('sub-akademik-' + s)) document.getElementById('sub-akademik-' + s).className = 'flex-1 py-2 px-2 rounded-xl text-gray-600 font-bold';
      });
      if(document.getElementById('box-akademik-' + sub)) document.getElementById('box-akademik-' + sub).classList.remove('hidden');
      if(document.getElementById('sub-akademik-' + sub)) document.getElementById('sub-akademik-' + sub).className = 'flex-1 py-2 px-2 rounded-xl bg-white text-[#1A98FF] shadow font-bold';
    }

    // SUB TAB KEUANGAN
    function subTabKeuangan(sub) {
      ['tabungan', 'spp'].forEach(function(s) {
        if(document.getElementById('box-keuangan-' + s)) document.getElementById('box-keuangan-' + s).classList.add('hidden');
        if(document.getElementById('sub-keuangan-' + s)) document.getElementById('sub-keuangan-' + s).className = 'flex-1 py-2 rounded-xl text-gray-600 font-bold';
      });
      if(document.getElementById('box-keuangan-' + sub)) document.getElementById('box-keuangan-' + sub).classList.remove('hidden');
      if(document.getElementById('sub-keuangan-' + sub)) document.getElementById('sub-keuangan-' + sub).className = 'flex-1 py-2 rounded-xl bg-white text-emerald-700 shadow font-bold';
    }

    // SUB TAB INFORMASI
    function subTabInformasi(sub) {
      ['pengumuman', 'kaldik'].forEach(function(s) {
        if(document.getElementById('box-info-' + s)) document.getElementById('box-info-' + s).classList.add('hidden');
        if(document.getElementById('sub-info-' + s)) document.getElementById('sub-info-' + s).className = 'flex-1 py-2 rounded-xl text-gray-600 font-bold';
      });
      if(document.getElementById('box-info-' + sub)) document.getElementById('box-info-' + sub).classList.remove('hidden');
      if(document.getElementById('sub-info-' + sub)) document.getElementById('sub-info-' + sub).className = 'flex-1 py-2 rounded-xl bg-white text-amber-700 shadow font-bold';
    }

    // TARIK SEMUA DATA REAL-TIME
    async function refreshAllData() {
      var sId = currentSiswaObj ? currentSiswaObj.id : null;

      // 1. Data Setoran
      var qSetor = db.from('tahfidz').select('*').order('tanggal', { ascending: false });
      if (sId) qSetor = qSetor.eq('siswa_id', sId);
      const { data: set } = await qSetor;
      var boxSetor = document.getElementById('list-riwayat-setoran');
      if(boxSetor) {
        boxSetor.innerHTML = '';
        if (!set || set.length === 0) boxSetor.innerHTML = '<p class="text-gray-400 italic">Belum ada riwayat setoran.</p>';
        else {
          document.getElementById('stat-setoran').innerText = (set[0].surah_jilid || '-') + ' (' + (set[0].nilai || 'A') + ')';
          set.forEach(s => {
            boxSetor.innerHTML += `<div class="bg-gray-50 p-2.5 rounded-xl border flex justify-between items-center mb-1">
              <div><b>📅 ${s.tanggal}</b> — ${s.surah_jilid || '-'}<br><span class="text-gray-500">Hal/Ayat: ${s.ayat_halaman || '-'}</span></div>
              <span class="bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded-full text-[10px]">${s.nilai || 'A'}</span>
            </div>`;
          });
        }
      }

      // 2. Data Absensi
      if (sId) {
        const { data: abs } = await db.from('absensi').select('*').eq('siswa_id', sId);
        var h = abs ? abs.filter(a => a.status === 'Hadir').length : 0;
        if(document.getElementById('akademik-hadir')) document.getElementById('akademik-hadir').innerText = h;
        if(document.getElementById('akademik-izin')) document.getElementById('akademik-izin').innerText = abs ? abs.filter(a => a.status === 'Izin').length : 0;
        if(document.getElementById('akademik-sakit')) document.getElementById('akademik-sakit').innerText = abs ? abs.filter(a => a.status === 'Sakit').length : 0;
        if(document.getElementById('akademik-alpha')) document.getElementById('akademik-alpha').innerText = abs ? abs.filter(a => a.status === 'Alfa' || a.status === 'Alpha').length : 0;
        if(document.getElementById('stat-kehadiran')) document.getElementById('stat-kehadiran').innerText = h + ' Hari Hadir';
      }

      // 3. Data Pengumuman
      const { data: peng } = await db.from('pengumuman').select('*').order('tanggal', { ascending: false });
      var boxP = document.getElementById('beranda-pengumuman-preview');
      var boxPL = document.getElementById('list-pengumuman-lengkap');
      if(boxP && boxPL) {
        boxP.innerHTML = ''; boxPL.innerHTML = '';
        if (!peng || peng.length === 0) {
          boxP.innerHTML = '<p class="text-gray-400 italic">Belum ada pengumuman.</p>';
          boxPL.innerHTML = '<p class="text-gray-400 italic">Belum ada pengumuman.</p>';
        } else {
          peng.forEach((p, idx) => {
            if (idx < 2) boxP.innerHTML += `<div class="bg-amber-50 p-2 rounded-xl border border-amber-100 mb-1"><b class="text-amber-900">${p.judul}</b><p class="text-gray-600 truncate">${p.isi}</p></div>`;
            boxPL.innerHTML += `<div class="bg-white p-3 rounded-2xl border shadow-sm space-y-1 mb-2"><div class="flex justify-between font-bold text-amber-900"><span>📢 ${p.judul}</span><span class="text-gray-400 text-[10px]">${p.tanggal}</span></div><p class="text-gray-700">${p.isi}</p></div>`;
          });
        }
      }
    }

    async function loadKelasOptions() {
      const { data } = await db.from('siswa').select('kelas, Kelas');
      var list = data ? [...new Set(data.map(item => item.kelas || item.Kelas))] : ['Kelas 1', 'Kelas 2', 'Kelas 3', 'Kelas 4', 'Kelas 5', 'Kelas 6'];

      ['absen-kelas', 'setor-kelas', 'tasmi-kelas', 'disiplin-kelas', 'tugas-kelas', 'tabungan-kelas', 'spp-kelas'].forEach(function(id) {
        var el = document.getElementById(id);
        if(el) {
          el.innerHTML = '<option value="">Pilih Kelas</option>';
          list.forEach(function(k) { el.innerHTML += '<option value="' + k + '">' + k + '</option>'; });
        }
      });
    }

    async function loadSiswaSetor() {
      var kls = document.getElementById('setor-kelas').value;
      var el = document.getElementById('setor-nama');
      const { data: siswa } = await db.from('siswa').select('*').or('kelas.eq.' + kls + ',Kelas.eq.' + kls);
      el.innerHTML = '<option value="">Pilih Siswa</option>';
      if (siswa) {
        siswa.forEach(s => el.innerHTML += `<option value="${s.id}">${s.nama || s.Nama_Siswa}</option>`);
      }
    }

    async function simpanSetoranData() {
      var payload = {
        tanggal: document.getElementById('setor-tgl').value,
        siswa_id: document.getElementById('setor-nama').value,
        jenis: document.getElementById('setor-kategori').value,
        surah_jilid: document.getElementById('setor-materi').value,
        ayat_halaman: document.getElementById('setor-halaman').value,
        nilai: document.getElementById('setor-nilai').value,
        penerima: currentSessionUser
      };
      const { error } = await db.from('tahfidz').insert([payload]);
      if (error) alert('Error: ' + error.message);
      else { alert('✅ Setoran berhasil disimpan!'); refreshAllData(); }
    }
  </script>
