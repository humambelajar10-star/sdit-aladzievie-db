<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi SDIT Aladzievie</title>
    <!-- Tailwind CSS & Supabase JS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .active-tab {
            border-bottom: 3px solid #1e40af;
            color: #1e40af;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <!-- 1. HALAMAN LOGIN (Sama Persis Tampilan Apps Script) -->
    <div id="sec-login" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-200">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-blue-900 text-white font-bold text-2xl flex items-center justify-center rounded-full mx-auto mb-3">
                    SDIT
                </div>
                <h1 class="text-2xl font-bold text-gray-800">SDIT ALADZIEVIE</h1>
                <p class="text-xs text-gray-500">Sistem Presensi, Tahfidz & Kedisiplinan</p>
            </div>
            
            <div id="login-alert" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-sm"></div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-1">Username</label>
                    <input type="text" id="input-username" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm" placeholder="Masukkan username" required>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-1">Password</label>
                    <input type="password" id="input-password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm" placeholder="Masukkan password" required>
                </div>
                <button type="submit" id="btn-login-submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-2.5 px-4 rounded-lg transition duration-200 text-sm shadow">
                    Masuk
                </button>
            </form>
        </div>
    </div>

    <!-- 2. DASHBOARD UTAMA (UI Persis Versi Apps Script) -->
    <div id="sec-dashboard" class="hidden min-h-screen flex flex-col">
        
        <!-- HEADER / NAVBAR -->
        <nav class="bg-blue-900 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <span class="font-bold text-lg tracking-wide">SDIT ALADZIEVIE</span>
                </div>
                <div class="flex items-center space-x-4 text-sm">
                    <span id="user-display-name" class="font-medium bg-blue-800 px-3 py-1 rounded-full text-xs"></span>
                    <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded transition">
                        Keluar
                    </button>
                </div>
            </div>
        </nav>

        <!-- SUB NAV / NAVIGATION TABS -->
        <div class="bg-white border-b shadow-sm sticky top-0 z-10">
            <div class="max-w-7xl mx-auto px-4 flex space-x-4 overflow-x-auto text-sm">
                <button onclick="openTab('absensi')" id="tab-nav-absensi" class="py-3 px-3 text-gray-600 hover:text-blue-900 active-tab">📌 Absensi Siswa</button>
                <button onclick="openTab('tahfidz')" id="tab-nav-tahfidz" class="py-3 px-3 text-gray-600 hover:text-blue-900">📖 Tahfidz / Tahsin</button>
                <button onclick="openTab('kedisiplinan')" id="tab-nav-kedisiplinan" class="py-3 px-3 text-gray-600 hover:text-blue-900">⭐ Kedisiplinan</button>
                <button onclick="openTab('rekap')" id="tab-nav-rekap" class="py-3 px-3 text-gray-600 hover:text-blue-900">📊 Rekap Data</button>
            </div>
        </div>

        <!-- MAIN CONTAINER -->
        <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">

            <!-- TAB 1: ABSENSI -->
            <section id="content-absensi" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-xl font-bold text-gray-800 mb-4 pb-2 border-b">Form Presensi Harian Siswa</h2>
                <form onsubmit="submitAbsensi(event)" class="space-y-4 max-w-xl">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Tanggal</label>
                            <input type="date" id="abs-tanggal" class="w-full px-3 py-2 border rounded-md text-sm" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Kelas</label>
                            <select id="abs-kelas" class="w-full px-3 py-2 border rounded-md text-sm" required>
                                <option value="">-- Pilih Kelas --</option>
                                <option value="Kelas 1">Kelas 1</option>
                                <option value="Kelas 2">Kelas 2</option>
                                <option value="Kelas 3">Kelas 3</option>
                                <option value="Kelas 4">Kelas 4</option>
                                <option value="Kelas 5">Kelas 5</option>
                                <option value="Kelas 6">Kelas 6</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">ID / NIS Siswa</label>
                        <input type="number" id="abs-siswa-id" placeholder="Masukkan ID Siswa" class="w-full px-3 py-2 border rounded-md text-sm" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Status Kehadiran</label>
                        <div class="grid grid-cols-4 gap-2">
                            <label class="flex items-center justify-center p-2 border rounded cursor-pointer hover:bg-blue-50">
                                <input type="radio" name="abs-status" value="Hadir" checked class="mr-1"> Hadir
                            </label>
                            <label class="flex items-center justify-center p-2 border rounded cursor-pointer hover:bg-yellow-50">
                                <input type="radio" name="abs-status" value="Izin" class="mr-1"> Izin
                            </label>
                            <label class="flex items-center justify-center p-2 border rounded cursor-pointer hover:bg-blue-50">
                                <input type="radio" name="abs-status" value="Sakit" class="mr-1"> Sakit
                            </label>
                            <label class="flex items-center justify-center p-2 border rounded cursor-pointer hover:bg-red-50">
                                <input type="radio" name="abs-status" value="Alfa" class="mr-1"> Alfa
                            </label>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Keterangan</label>
                        <textarea id="abs-keterangan" rows="2" placeholder="Catatan tambahan (opsional)..." class="w-full px-3 py-2 border rounded-md text-sm"></textarea>
                    </div>
                    <button type="submit" class="bg-blue-900 hover:bg-blue-800 text-white font-bold py-2 px-6 rounded-md text-sm shadow">
                        Simpan Presensi
                    </button>
                </form>
            </section>

            <!-- TAB 2: TAHFIDZ -->
            <section id="content-tahfidz" class="hidden bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-xl font-bold text-gray-800 mb-4 pb-2 border-b">Input Setoran Tahfidz & Tahsin</h2>
                <form onsubmit="submitTahfidz(event)" class="space-y-4 max-w-xl">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Tanggal</label>
                            <input type="date" id="tah-tanggal" class="w-full px-3 py-2 border rounded-md text-sm" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Jenis Setoran</label>
                            <select id="tah-jenis" class="w-full px-3 py-2 border rounded-md text-sm" required>
                                <option value="Tahfidz">Tahfidz (Hafalan)</option>
                                <option value="Tahsin">Tahsin (Bacaan)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">ID / NIS Siswa</label>
                        <input type="number" id="tah-siswa-id" placeholder="Masukkan ID Siswa" class="w-full px-3 py-2 border rounded-md text-sm" required>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Surah / Jilid</label>
                            <input type="text" id="tah-surah" placeholder="Contoh: An-Naba / Iqro 3" class="w-full px-3 py-2 border rounded-md text-sm" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Ayat / Halaman</label>
                            <input type="text" id="tah-ayat" placeholder="Contoh: 1-15 / Hal 12" class="w-full px-3 py-2 border rounded-md text-sm" required>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nilai / Predikat</label>
                        <select id="tah-nilai" class="w-full px-3 py-2 border rounded-md text-sm" required>
                            <option value="A (Mumtaz)">A (Mumtaz)</option>
                            <option value="B (Jayyid)">B (Jayyid)</option>
                            <option value="C (Maqbul)">C (Maqbul)</option>
                        </select>
                    </div>
                    <button type="submit" class="bg-green-700 hover:bg-green-800 text-white font-bold py-2 px-6 rounded-md text-sm shadow">
                        Simpan Setoran
                    </button>
                </form>
            </section>

            <!-- TAB 3: KEDISIPLINAN -->
            <section id="content-kedisiplinan" class="hidden bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-xl font-bold text-gray-800 mb-4 pb-2 border-b">Catatan Kedisiplinan & Prestasi</h2>
                <form onsubmit="submitKedisiplinan(event)" class="space-y-4 max-w-xl">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Tanggal</label>
                            <input type="date" id="ked-tanggal" class="w-full px-3 py-2 border rounded-md text-sm" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Kategori</label>
                            <select id="ked-jenis" class="w-full px-3 py-2 border rounded-md text-sm" required>
                                <option value="Prestasi">Prestasi (+)</option>
                                <option value="Pelanggaran">Pelanggaran (-)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">ID / NIS Siswa</label>
                        <input type="number" id="ked-siswa-id" placeholder="Masukkan ID Siswa" class="w-full px-3 py-2 border rounded-md text-sm" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Catatan Event / Detail</label>
                        <textarea id="ked-catatan" rows="3" placeholder="Tuliskan catatan detail kedisiplinan atau prestasi..." class="w-full px-3 py-2 border rounded-md text-sm" required></textarea>
                    </div>
                    <button type="submit" class="bg-purple-800 hover:bg-purple-900 text-white font-bold py-2 px-6 rounded-md text-sm shadow">
                        Simpan Catatan
                    </button>
                </form>
            </section>

            <!-- TAB 4: REKAP DATA -->
            <section id="content-rekap" class="hidden bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <div class="flex justify-between items-center mb-4 pb-2 border-b">
                    <h2 class="text-xl font-bold text-gray-800">Rekap Presensi Harian</h2>
                    <button onclick="fetchRekapData()" class="bg-gray-100 hover:bg-gray-200 border px-3 py-1.5 rounded text-xs font-medium">
                        🔄 Refresh Data
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-gray-700 text-xs uppercase border-b">
                                <th class="p-3">Tanggal</th>
                                <th class="p-3">Kelas</th>
                                <th class="p-3">ID Siswa</th>
                                <th class="p-3">Status</th>
                                <th class="p-3">Keterangan</th>
                            </tr>
                        </thead>
                        <tbody id="table-rekap-body">
                            <tr><td colspan="5" class="p-4 text-center text-gray-400">Klik Refresh Data untuk memuat...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <!-- JAVASCRIPT SUPABASE BACKEND -->
    <script>
        const SUPABASE_URL = "https://tavoxawaparjahyldecc.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhdm94YXdhcGFyamFoeWxkZWNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4OTc4MzgsImV4cCI6MjEwMTQ3MzgzOH0.21A23nlVJ9gaF1u86W3tQCcNggPOi1Wvaj4awaV0nEI";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let loggedUser = null;

        // Auto Set Today's Date
        document.querySelectorAll('input[type="date"]').forEach(el => {
            el.value = new Date().toISOString().split('T')[0];
        });

        // Login Handler
        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('input-username').value.trim();
            const p = document.getElementById('input-password').value.trim();
            const alertBox = document.getElementById('login-alert');
            const btn = document.getElementById('btn-login-submit');

            alertBox.classList.add('hidden');
            btn.innerText = 'Memproses...';
            btn.disabled = true;

            try {
                const { data, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('username', u)
                    .eq('password', p)
                    .single();

                if (error || !data) throw new Error("Username atau Password salah!");

                loggedUser = data;
                document.getElementById('sec-login').classList.add('hidden');
                document.getElementById('sec-dashboard').classList.remove('hidden');
                document.getElementById('user-display-name').innerText = `${data.nama} (${data.role.toUpperCase()})`;

            } catch (err) {
                alertBox.innerText = err.message;
                alertBox.classList.remove('hidden');
            } finally {
                btn.innerText = 'Masuk';
                btn.disabled = false;
            }
        }

        // Logout Handler
        function handleLogout() {
            loggedUser = null;
            document.getElementById('sec-dashboard').classList.add('hidden');
            document.getElementById('sec-login').classList.remove('hidden');
        }

        // Tab Navigation
        function openTab(tabName) {
            ['absensi', 'tahfidz', 'kedisiplinan', 'rekap'].forEach(t => {
                document.getElementById(`content-${t}`).classList.add('hidden');
                document.getElementById(`tab-nav-${t}`).classList.remove('active-tab');
            });

            document.getElementById(`content-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-nav-${tabName}`).classList.add('active-tab');

            if (tabName === 'rekap') fetchRekapData();
        }

        // Save Absensi
        async function submitAbsensi(e) {
            e.preventDefault();
            const statusVal = document.querySelector('input[name="abs-status"]:checked').value;
            const payload = {
                tanggal: document.getElementById('abs-tanggal').value,
                kelas: document.getElementById('abs-kelas').value,
                siswa_id: document.getElementById('abs-siswa-id').value,
                status: statusVal,
                keterangan: document.getElementById('abs-keterangan').value
            };

            const { error } = await supabaseClient.from('absensi').insert([payload]);
            if (error) alert("Error: " + error.message);
            else { alert("✅ Data Presensi Berhasil Disimpan!"); e.target.reset(); }
        }

        // Save Tahfidz
        async function submitTahfidz(e) {
            e.preventDefault();
            const payload = {
                tanggal: document.getElementById('tah-tanggal').value,
                jenis: document.getElementById('tah-jenis').value,
                siswa_id: document.getElementById('tah-siswa-id').value,
                surah_jilid: document.getElementById('tah-surah').value,
                ayat_halaman: document.getElementById('tah-ayat').value,
                nilai: document.getElementById('tah-nilai').value,
                penerima: loggedUser ? loggedUser.nama : 'Guru'
            };

            const { error } = await supabaseClient.from('tahfidz').insert([payload]);
            if (error) alert("Error: " + error.message);
            else { alert("✅ Data Setoran Berhasil Disimpan!"); e.target.reset(); }
        }

        // Save Kedisiplinan
        async function submitKedisiplinan(e) {
            e.preventDefault();
            const payload = {
                tanggal: document.getElementById('ked-tanggal').value,
                jenis: document.getElementById('ked-jenis').value,
                siswa_id: document.getElementById('ked-siswa-id').value,
                catatan: document.getElementById('ked-catatan').value,
                pencatat: loggedUser ? loggedUser.nama : 'Guru'
            };

            const { error } = await supabaseClient.from('kedisiplinan').insert([payload]);
            if (error) alert("Error: " + error.message);
            else { alert("✅ Catatan Kedisiplinan Berhasil Disimpan!"); e.target.reset(); }
        }

        // Fetch Rekap
        async function fetchRekapData() {
            const tbody = document.getElementById('table-rekap-body');
            tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-400">Memuat data...</td></tr>';

            const { data, error } = await supabaseClient.from('absensi').select('*').order('created_at', { ascending: false }).limit(20);

            if (error || !data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-400">Belum ada data presensi.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-3">${item.tanggal}</td>
                    <td class="p-3 font-semibold">${item.kelas}</td>
                    <td class="p-3">Siswa #${item.siswa_id}</td>
                    <td class="p-3"><span class="px-2 py-0.5 rounded text-xs font-bold ${item.status === 'Hadir' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${item.status}</span></td>
                    <td class="p-3 text-gray-500">${item.keterangan || '-'}</td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
